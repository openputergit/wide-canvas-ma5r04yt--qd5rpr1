<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credit Card Recommender</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        .category-container::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-gray-50">
    <div class="max-w-4xl mx-auto p-4 sm:p-6 lg:p-8">
        <h1 class="text-3xl font-bold text-center text-blue-600 mb-8">Smart Credit Card Recommender</h1>
        
        <div class="bg-white rounded-xl shadow-lg p-6 mb-8">
            <h2 class="text-xl font-semibold mb-4">Your Monthly Spending Habits</h2>
            
            <div class="space-y-6">
                <!-- Main Categories -->
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div class="category-item">
                        <label class="block text-sm font-medium text-gray-700">Shopping</label>
                        <div class="mt-2 space-y-2">
                            <input type="number" placeholder="Online Shopping (₹)" class="spending-input w-full p-2 border rounded" data-category="shopping-online">
                            <input type="number" placeholder="Offline Shopping (₹)" class="spending-input w-full p-2 border rounded" data-category="shopping-offline">
                        </div>
                    </div>
                    
                    <div class="category-item">
                        <label class="block text-sm font-medium text-gray-700">Dining</label>
                        <div class="mt-2 space-y-2">
                            <input type="number" placeholder="Food Delivery (₹)" class="spending-input w-full p-2 border rounded" data-category="dining-delivery">
                            <input type="number" placeholder="Dine Out (₹)" class="spending-input w-full p-2 border rounded" data-category="dining-out">
                        </div>
                    </div>
                    
                    <div class="category-item">
                        <label class="block text-sm font-medium text-gray-700">Fuel & Travel</label>
                        <div class="mt-2 space-y-2">
                            <input type="number" placeholder="Fuel (₹)" class="spending-input w-full p-2 border rounded" data-category="fuel">
                            <input type="number" placeholder="Public Transport (₹)" class="spending-input w-full p-2 border rounded" data-category="transport">
                        </div>
                    </div>
                    
                    <div class="category-item">
                        <label class="block text-sm font-medium text-gray-700">Utilities</label>
                        <div class="mt-2 space-y-2">
                            <input type="number" placeholder="Electricity & Water (₹)" class="spending-input w-full p-2 border rounded" data-category="utilities-basic">
                            <input type="number" placeholder="Internet & Phone (₹)" class="spending-input w-full p-2 border rounded" data-category="utilities-telecom">
                        </div>
                    </div>
                </div>
                
                <button onclick="recommendCards()" class="w-full bg-blue-600 text-white py-3 rounded-lg font-semibold hover:bg-blue-700 transition-colors">
                    Get Card Recommendations
                </button>
            </div>
        </div>
        
        <div id="recommendations" class="hidden space-y-4">
            <h2 class="text-xl font-semibold mb-4">Recommended Credit Cards</h2>
            <div id="cards-container" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <!-- Cards will be inserted here -->
            </div>
        </div>
    </div>

    <script>
        const creditCards = [
            {
                name: "Shopping Plus Card",
                bank: "ABC Bank",
                benefits: ["5% cashback on online shopping", "3% on offline shopping", "1% on all other spends"],
                bestFor: ["shopping-online", "shopping-offline"],
                image: "https://images.unsplash.com/photo-1526304640581-d334cdbbf45e?w=400"
            },
            {
                name: "Dining Rewards Card",
                bank: "XYZ Bank",
                benefits: ["10% cashback on food delivery", "5% on dining out", "Movie ticket discounts"],
                bestFor: ["dining-delivery", "dining-out"],
                image: "https://images.unsplash.com/photo-1593576706006-74a9b97191c3?w=400"
            },
            {
                name: "Travel Elite Card",
                bank: "PQR Bank",
                benefits: ["5% cashback on fuel", "Free airport lounge access", "3% on cab bookings"],
                bestFor: ["fuel", "transport"],
                image: "https://images.unsplash.com/photo-1620714223084-8fcacc6dfd8d?w=400"
            }
        ];

        function recommendCards() {
            const spendingInputs = document.querySelectorAll('.spending-input');
            const spending = {};
            let totalSpending = 0;

            spendingInputs.forEach(input => {
                const value = parseFloat(input.value) || 0;
                spending[input.dataset.category] = value;
                totalSpending += value;
            });

            const recommendations = creditCards.filter(card => {
                return card.bestFor.some(category => spending[category] > 0);
            });

            displayRecommendations(recommendations);
        }

        function displayRecommendations(cards) {
            const container = document.getElementById('cards-container');
            container.innerHTML = '';

            cards.forEach(card => {
                const cardElement = `
                    <div class="bg-white rounded-lg shadow-md p-4 border border-gray-200">
                        <img src="${card.image}" alt="${card.name}" class="w-full h-48 object-cover rounded-lg mb-4">
                        <h3 class="text-lg font-semibold">${card.name}</h3>
                        <p class="text-gray-600 text-sm mb-2">${card.bank}</p>
                        <ul class="list-disc list-inside text-sm text-gray-700 space-y-1">
                            ${card.benefits.map(benefit => `<li>${benefit}</li>`).join('')}
                        </ul>
                    </div>
                `;
                container.innerHTML += cardElement;
            });

            document.getElementById('recommendations').classList.remove('hidden');
        }
    </script>
<script>document.body.addEventListener('wheel', e => { if (!e.ctrlKey) return; e.preventDefault(); return }, { passive: false })</script>
	</body>
</html>
